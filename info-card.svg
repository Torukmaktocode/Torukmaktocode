<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 280" width="490" height="280">
<rect width="490" height="280" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<rect width="490" height="32" rx="12" fill="#21262d"/>
<rect y="16" width="490" height="16" fill="#21262d"/>
<circle cx="16" cy="16" r="6" fill="#ff5f56"/>
<circle cx="36" cy="16" r="6" fill="#ffbd2e"/>
<circle cx="56" cy="16" r="6" fill="#27c93f"/>
<text x="245" y="21" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">info@terminal ~ $</text>
<style>
  .line { font-family: "Courier New", monospace; font-size: 13px; }
  .prompt { fill: #58a6ff; }
  .value { fill: #f0f6fc; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .reveal { animation: fadeIn 0.4s ease-out forwards; animation-fill-mode: both; opacity: 0; }
</style>
<text class="line reveal prompt" x="24" y="52" style="animation-delay: 0.00s" fill="#58a6ff">$ whoami</text>
<text class="line reveal value" x="24" y="70" style="animation-delay: 0.12s" fill="#f0f6fc">  Toruk_Makto_Code</text>
<text class="line reveal prompt" x="24" y="94" style="animation-delay: 0.36s" fill="#58a6ff">$ cat role.txt</text>
<text class="line reveal value" x="24" y="112" style="animation-delay: 0.48s" fill="#7ee787">  Full Stack Developer</text>
<text class="line reveal prompt" x="24" y="136" style="animation-delay: 0.72s" fill="#58a6ff">$ echo $STACK</text>
<text class="line reveal value" x="24" y="154" style="animation-delay: 0.84s" fill="#d2a8ff">  Python | JavaScript | React | Node.js</text>
<text class="line reveal prompt" x="24" y="178" style="animation-delay: 1.08s" fill="#58a6ff">$ cat focus.md</text>
<text class="line reveal value" x="24" y="196" style="animation-delay: 1.20s" fill="#ff7b72">  AI &amp; Automation</text>
<text class="line reveal prompt" x="24" y="220" style="animation-delay: 1.44s" fill="#58a6ff">$ echo $STATUS</text>
<text class="line reveal value" x="24" y="238" style="animation-delay: 1.56s" fill="#ffa657">  Open to opportunities</text>
<text class="line reveal prompt" x="24" y="262" style="animation-delay: 1.80s" fill="#58a6ff">$ pwd</text>
<text class="line reveal value" x="24" y="280" style="animation-delay: 1.92s" fill="#79c0ff">  Earth 🌎</text>
</svg>
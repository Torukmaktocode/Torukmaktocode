name: Update Heatmap

on:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6am UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - run: pip install requests playwright
      - run: playwright install chromium
      
      - run: python scripts/fetch_and_render.py
      - run: python scripts/svg_to_png.py
      
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update contribution heatmap [skip ci]"
          file_pattern: "contributions.svg contributions.png dark_mode.png"
